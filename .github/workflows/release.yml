# Publica una versión nueva de la agenda.
#
# Al subir una etiqueta vX.Y.Z (que debe coincidir con APP_VERSION de
# AgendaDigitalApp/app/version.py), GitHub compila MiAgendaDigital.exe en Windows
# y crea la «Release» con el ejecutable. Las agendas instaladas la detectan y
# ofrecen actualizarse. El texto de la etiqueta anotada se usa como novedades.

name: Publicar versión

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: AgendaDigitalApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar que la etiqueta coincide con la versión
        run: |
          VERSION=$(python -c "import re;print(re.search(r'APP_VERSION = \"([\d.]+)\"', open('app/version.py', encoding='utf-8').read()).group(1))")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con APP_VERSION ($VERSION) en app/version.py"
            exit 1
          fi

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"

      - name: Compilar MiAgendaDigital.exe
        run: python -m PyInstaller --noconfirm --clean MiAgendaDigital.spec

      - name: Comprobar que el ejecutable arranca
        shell: pwsh
        run: |
          $env:AGENDA_NO_BROWSER = "1"
          $env:AGENDA_DATA_DIR = "$env:RUNNER_TEMP\agenda-prueba"
          $env:AGENDA_PORT = "5099"
          $proc = Start-Process -FilePath "dist\MiAgendaDigital.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $r = Invoke-RestMethod -Uri "http://127.0.0.1:5099/api/ping" -TimeoutSec 2
              if ($r.app -eq "MiAgendaDigital" -and "v$($r.version)" -eq $env:GITHUB_REF_NAME) { $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Error "El ejecutable no ha respondido"; exit 1 }

      - name: Crear la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/-----BEGIN PGP/,$d' > notes.md
          if [ -s notes.md ] && [ "$(tr -d '[:space:]' < notes.md)" != "" ]; then
            NOTES=(--notes-file notes.md)
          else
            NOTES=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" dist/MiAgendaDigital.exe \
            --title "Mi Agenda Digital ${GITHUB_REF_NAME#v}" "${NOTES[@]}"
